<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>eoghar — Investor Services Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A96E;--gold-light:rgba(201,169,110,0.15);--gold-muted:rgba(201,169,110,0.06);
  --gold-dark:#8B6914;--gold-border:rgba(201,169,110,0.22);
  --ink:#09090B;--ink-soft:#18181B;--ink-mid:#3F3F46;--ink-muted:#71717A;
  --paper:#FAFAF9;--paper-warm:#F5F0E8;--paper-mid:#EDE8DF;--paper-dark:#DDD5C8;
  --white:#FFFFFF;
  --red:#B91C1C;--red-bg:rgba(185,28,28,0.07);
  --green:#15623A;--green-bg:rgba(21,98,58,0.07);
  --blue:#1E3A5F;--blue-bg:rgba(30,58,95,0.07);
  --amber:#92400E;--amber-bg:rgba(146,64,14,0.08);
  --pending:#7C3AED;--pending-bg:rgba(124,58,237,0.07);
  --radius:3px;
  --shadow-sm:0 1px 8px rgba(0,0,0,0.06);
  --shadow:0 4px 24px rgba(0,0,0,0.09);
  --shadow-lg:0 12px 56px rgba(0,0,0,0.15);
  --transition:all 0.2s cubic-bezier(0.4,0,0.2,1);
}
body{font-family:'DM Mono',monospace;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-1{animation:fadeUp 0.45s ease both}
.anim-2{animation:fadeUp 0.45s 0.07s ease both}
.anim-3{animation:fadeUp 0.45s 0.14s ease both}
.anim-4{animation:fadeUp 0.45s 0.21s ease both}
.anim-5{animation:fadeUp 0.45s 0.28s ease both}

/* LANDING */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;background:var(--ink-soft);position:relative;overflow:hidden}
.landing-grain{position:absolute;inset:0;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");pointer-events:none}
.landing-glow{position:absolute;width:600px;height:600px;background:radial-gradient(ellipse,rgba(201,169,110,0.07) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.landing-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:20px;opacity:0.8}
.landing-title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,60px);color:var(--white);font-weight:300;letter-spacing:-0.01em;text-align:center;margin-bottom:8px;line-height:1.05}
.landing-title em{font-style:italic;color:var(--gold)}
.landing-sub{font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.2em;text-align:center;margin-bottom:52px;text-transform:uppercase}
.role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;width:100%;max-width:720px}
.role-card{background:rgba(255,255,255,0.04);border:1px solid rgba(201,169,110,0.15);border-radius:var(--radius);padding:28px 24px;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden}
.role-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,169,110,0.08) 0%,transparent 60%);opacity:0;transition:opacity 0.2s}
.role-card:hover{border-color:rgba(201,169,110,0.4);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.role-card:hover::before{opacity:1}
.role-card-icon{font-size:22px;margin-bottom:14px}
.role-card-title{font-family:'Syne',sans-serif;font-size:15px;color:var(--white);font-weight:500;margin-bottom:6px}
.role-card-desc{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.05em;line-height:1.6}
.role-card-arrow{position:absolute;bottom:20px;right:20px;color:var(--gold);opacity:0.4;font-size:16px;transition:var(--transition)}
.role-card:hover .role-card-arrow{opacity:1;transform:translateX(3px)}
.landing-mark{margin-top:48px;font-size:9px;color:rgba(255,255,255,0.18);letter-spacing:0.25em;text-transform:uppercase}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper-warm)}
.login-box{width:100%;max-width:420px;background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:40px;box-shadow:var(--shadow)}
.login-back{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--ink-muted);letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;margin-bottom:32px;transition:color 0.15s}
.login-back:hover{color:var(--gold)}
.login-eyebrow{font-size:9px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.login-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:var(--ink);margin-bottom:28px;line-height:1.1}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:10px;letter-spacing:0.12em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:7px}
.form-input{width:100%;padding:11px 14px;border:1px solid var(--paper-dark);border-radius:var(--radius);font-family:'DM Mono',monospace;font-size:13px;color:var(--ink);background:var(--paper);transition:var(--transition);outline:none}
.form-input:focus{border-color:var(--gold);background:var(--white)}
.form-input.error-input{border-color:var(--red)}
.form-hint{margin-top:6px;font-size:10px;color:var(--ink-muted);background:var(--paper-warm);padding:8px 10px;border-radius:var(--radius);line-height:1.5}
.form-error{font-size:11px;color:var(--red);margin-top:10px;padding:9px 12px;background:var(--red-bg);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--radius);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.08em;font-weight:500;cursor:pointer;transition:var(--transition);border:none;text-transform:uppercase}
.btn-primary{background:var(--ink);color:var(--white)}
.btn-primary:hover{background:var(--gold-dark);color:var(--white)}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-gold:hover{background:var(--gold-dark);color:var(--white)}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--paper-dark)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(185,28,28,0.2)}
.btn-danger:hover{background:var(--red);color:var(--white)}
.btn-sm{padding:7px 14px;font-size:10px}
.btn-full{width:100%}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* NEW MANAGER SETUP LINK */
.setup-link{margin-top:24px;padding-top:20px;border-top:1px solid var(--paper-dark);text-align:center}
.setup-link-label{font-size:10px;color:var(--ink-muted);margin-bottom:10px;letter-spacing:0.05em}
.setup-link-btn{font-size:11px;color:var(--gold);cursor:pointer;letter-spacing:0.08em;text-decoration:underline;text-underline-offset:3px;transition:color 0.15s}
.setup-link-btn:hover{color:var(--gold-dark)}

/* INVITE GATE */
.invite-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper-warm)}
.invite-box{width:100%;max-width:440px;background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:40px;box-shadow:var(--shadow)}
.invite-icon{font-size:32px;margin-bottom:20px}
.invite-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;margin-bottom:8px;line-height:1.1}
.invite-sub{font-size:11px;color:var(--ink-muted);line-height:1.7;margin-bottom:28px}
.invite-note{font-size:10px;color:var(--ink-muted);margin-top:16px;line-height:1.6;padding:10px 12px;background:var(--paper-warm);border-radius:var(--radius);border-left:2px solid var(--gold)}

/* ONBOARDING FORM */
.onboard-wrap{min-height:100vh;background:var(--paper-warm);padding:40px 24px}
.onboard-inner{max-width:760px;margin:0 auto}
.onboard-header{margin-bottom:36px}
.onboard-eyebrow{font-size:9px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.onboard-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;color:var(--ink);margin-bottom:6px}
.onboard-sub{font-size:11px;color:var(--ink-muted);line-height:1.7}
.progress-bar{display:flex;gap:6px;margin-bottom:36px}
.progress-step{flex:1;height:3px;border-radius:2px;background:var(--paper-dark);transition:background 0.3s}
.progress-step.active{background:var(--gold)}
.progress-step.done{background:var(--gold-dark)}
.progress-labels{display:flex;justify-content:space-between;margin-bottom:32px}
.progress-label{font-size:9px;letter-spacing:0.1em;color:var(--ink-muted);text-transform:uppercase}
.progress-label.active{color:var(--gold)}
.form-card{background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:32px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.form-card-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--paper-dark);letter-spacing:0.05em}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:600px){.form-row,.form-row-3{grid-template-columns:1fr}}
.form-select{width:100%;padding:11px 14px;border:1px solid var(--paper-dark);border-radius:var(--radius);font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);background:var(--paper);outline:none;transition:var(--transition);cursor:pointer}
.form-select:focus{border-color:var(--gold)}
.form-textarea{width:100%;padding:11px 14px;border:1px solid var(--paper-dark);border-radius:var(--radius);font-family:'DM Mono',monospace;font-size:12px;color:var(--ink);background:var(--paper);outline:none;transition:var(--transition);resize:vertical;min-height:90px;line-height:1.6}
.form-textarea:focus{border-color:var(--gold)}
.jurisdiction-tag{display:inline-flex;align-items:center;gap:6px;background:var(--gold-light);border:1px solid var(--gold-border);border-radius:2px;padding:4px 10px;font-size:11px;color:var(--gold-dark);margin:4px}
.jurisdiction-tag button{background:none;border:none;color:var(--gold-dark);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.jurisdiction-add{display:flex;gap:8px;margin-top:10px}
.upload-zone{border:1px dashed var(--paper-dark);border-radius:var(--radius);padding:28px;text-align:center;transition:var(--transition);cursor:pointer;background:var(--paper);position:relative}
.upload-zone:hover{border-color:var(--gold);background:var(--gold-muted)}
.upload-zone-icon{font-size:24px;margin-bottom:10px}
.upload-zone-title{font-size:12px;color:var(--ink-mid);margin-bottom:4px}
.upload-zone-sub{font-size:10px;color:var(--ink-muted)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.uploaded-file{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper-warm);border:1px solid var(--paper-dark);border-radius:var(--radius);margin-top:8px}
.uploaded-file-icon{font-size:16px}
.uploaded-file-name{font-size:11px;color:var(--ink);flex:1}
.uploaded-file-status{font-size:10px;color:var(--green)}
.ai-prefill-banner{background:linear-gradient(135deg,rgba(201,169,110,0.1),rgba(201,169,110,0.04));border:1px solid var(--gold-border);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:14px}
.ai-prefill-icon{font-size:20px;flex-shrink:0}
.ai-prefill-text{font-size:11px;color:var(--ink-mid);line-height:1.6}
.ai-prefill-text strong{color:var(--gold-dark)}
.ai-prefill-btn{margin-top:8px}
.jurisdiction-reporting{background:var(--paper-warm);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:16px;margin-top:8px}
.jr-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.jr-flag{font-size:13px;font-weight:600;color:var(--ink)}
.jr-body{display:grid;gap:10px}
.form-nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
.step-counter{font-size:10px;color:var(--ink-muted);letter-spacing:0.1em}

/* PENDING STATUS */
.pending-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper-warm)}
.pending-box{width:100%;max-width:520px;background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:48px 40px;box-shadow:var(--shadow);text-align:center}
.pending-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;background:var(--pending-bg);border:1px solid rgba(124,58,237,0.2);color:var(--pending);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:24px}
.pending-dot{width:6px;height:6px;border-radius:50%;background:var(--pending);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.pending-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;margin-bottom:12px}
.pending-sub{font-size:11px;color:var(--ink-muted);line-height:1.8;margin-bottom:28px}
.checklist{text-align:left;background:var(--paper-warm);border-radius:var(--radius);padding:20px;margin-bottom:28px}
.checklist-title{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:14px}
.checklist-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--paper-dark);font-size:11px;color:var(--ink-mid)}
.checklist-item:last-child{border-bottom:none}
.checklist-item.done{color:var(--green)}
.checklist-item.pending-item{color:var(--ink-muted)}
.checklist-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}

/* APP SHELL */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
@media(max-width:768px){.app{grid-template-columns:1fr}}
.sidebar{background:var(--ink-soft);padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-brand{padding:28px 22px 20px;border-bottom:1px solid rgba(255,255,255,0.05)}
.sidebar-brand-name{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--white);font-weight:300;letter-spacing:0.02em}
.sidebar-brand-sub{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:0.2em;text-transform:uppercase;margin-top:3px}
.sidebar-user{padding:16px 22px;background:rgba(201,169,110,0.05);border-bottom:1px solid rgba(255,255,255,0.05)}
.sidebar-user-name{font-size:12px;color:var(--white);font-weight:500}
.sidebar-user-role{font-size:9px;color:var(--gold);letter-spacing:0.15em;text-transform:uppercase;margin-top:2px}
.sidebar-user-status{font-size:9px;margin-top:4px;padding:2px 8px;border-radius:10px;display:inline-block}
.status-live{background:rgba(21,98,58,0.25);color:#4ADE80}
.status-pending{background:rgba(124,58,237,0.2);color:#A78BFA}
.nav-section{padding:16px 0}
.nav-label{font-size:8px;letter-spacing:0.25em;color:rgba(255,255,255,0.2);text-transform:uppercase;padding:0 22px 8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 22px;font-size:11px;color:rgba(255,255,255,0.5);cursor:pointer;transition:var(--transition);letter-spacing:0.04em}
.nav-item:hover{color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.04)}
.nav-item.active{color:var(--white);background:rgba(201,169,110,0.1);border-right:2px solid var(--gold)}
.nav-item-icon{width:16px;text-align:center;font-size:13px}
.sidebar-logout{margin-top:auto;padding:20px 22px;border-top:1px solid rgba(255,255,255,0.05)}
.logout-btn{font-size:10px;color:rgba(255,255,255,0.3);cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.15s}
.logout-btn:hover{color:rgba(255,255,255,0.6)}
.main{background:var(--paper);overflow-y:auto}
.main-header{padding:28px 36px 20px;border-bottom:1px solid var(--paper-dark);background:var(--white)}
.main-header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;color:var(--ink)}
.page-sub{font-size:10px;color:var(--ink-muted);letter-spacing:0.05em;margin-top:4px}
.main-body{padding:28px 36px}
@media(max-width:768px){.main-header,.main-body{padding:20px}}

/* DASHBOARD */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:10px}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;color:var(--ink);line-height:1}
.stat-sub{font-size:10px;color:var(--ink-muted);margin-top:6px}
.stat-trend-up{color:var(--green)}
.section-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink);margin-bottom:14px}
.table-wrap{background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:24px}
.table-header{display:grid;padding:12px 20px;background:var(--paper-warm);border-bottom:1px solid var(--paper-dark);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--ink-muted)}
.table-row{display:grid;padding:14px 20px;border-bottom:1px solid var(--paper-mid);align-items:center;transition:background 0.15s;font-size:11px}
.table-row:last-child{border-bottom:none}
.table-row:hover{background:var(--paper)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:2px;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-gold{background:var(--gold-light);color:var(--gold-dark)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-grey{background:rgba(0,0,0,0.05);color:var(--ink-muted)}
.badge-pending{background:var(--pending-bg);color:var(--pending)}
.action-row{display:flex;gap:8px;align-items:center}
.workflow-item{background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm)}
.workflow-item.overdue{border-left:3px solid var(--red)}
.workflow-item.due-soon{border-left:3px solid var(--gold)}
.workflow-item.complete{border-left:3px solid var(--green)}
.workflow-item.pending-item{border-left:3px solid var(--pending)}
.workflow-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-red{background:var(--red)}
.dot-gold{background:var(--gold)}
.dot-green{background:var(--green)}
.dot-pending{background:var(--pending)}
.workflow-info{flex:1}
.workflow-title{font-size:12px;color:var(--ink);margin-bottom:3px}
.workflow-meta{font-size:10px;color:var(--ink-muted)}
.workflow-right{text-align:right}
.workflow-due{font-size:10px;color:var(--ink-muted)}
.workflow-assignee{font-size:10px;color:var(--gold-dark);margin-top:2px}
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-muted);font-size:11px}
.empty-icon{font-size:28px;margin-bottom:12px}

/* CRM INTEGRATION */
.crm-card{background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.crm-connected{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--green-bg);border:1px solid rgba(21,98,58,0.15);border-radius:var(--radius);margin-bottom:16px}
.crm-connected-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.crm-connected-text{font-size:11px;color:var(--green)}
.crm-trigger-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--paper-mid);font-size:11px}
.crm-trigger-item:last-child{border-bottom:none}
.crm-trigger-icon{font-size:16px;width:24px;text-align:center}
.crm-trigger-label{flex:1;color:var(--ink-mid)}
.crm-trigger-status{font-size:10px}

/* APPROVAL PANEL */
.approval-card{background:var(--white);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:24px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.approval-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.approval-info{}
.approval-title{font-size:13px;color:var(--ink);font-weight:500;margin-bottom:4px}
.approval-meta{font-size:10px;color:var(--ink-muted);line-height:1.5}
.approval-actions{display:flex;gap:8px}
.preview-box{background:var(--paper-warm);border:1px solid var(--paper-dark);border-radius:var(--radius);padding:16px;font-size:11px;color:var(--ink-mid);line-height:1.8;margin:14px 0}
.preview-box p{margin-bottom:8px}
.preview-box p:last-child{margin-bottom:0}
.approval-signatories{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.signatory{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--paper-dark);border-radius:2px;font-size:10px;color:var(--ink-muted)}
.signatory.signed{border-color:rgba(21,98,58,0.3);color:var(--green);background:var(--green-bg)}
.signatory-icon{font-size:11px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn 0.2s ease}
.modal{background:var(--white);border-radius:var(--radius);padding:32px;width:100%;max-width:520px;box-shadow:var(--shadow-lg);animation:fadeUp 0.25s ease}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin-bottom:8px}
.modal-sub{font-size:11px;color:var(--ink-muted);margin-bottom:24px;line-height:1.6}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.divider{height:1px;background:var(--paper-dark);margin:24px 0}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:2px;font-size:10px;background:var(--paper-warm);border:1px solid var(--paper-dark);color:var(--ink-muted);margin:2px}

/* AUDIT TRAIL */
.audit-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--paper-mid);font-size:11px}
.audit-item:last-child{border-bottom:none}
.audit-time{color:var(--ink-muted);white-space:nowrap;min-width:80px}
.audit-icon{width:20px;text-align:center;flex-shrink:0}
.audit-text{flex:1;color:var(--ink-mid);line-height:1.5}
.audit-actor{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;

/* ── DEMO USERS ── */
const USERS={
  "investor@demo.com":{password:"demo",role:"investor",name:"Alexandra Chen"},
  "manager@demo.com":{password:"demo",role:"fund_manager",name:"James Harrington",status:"live"},
  "manager.pending@demo.com":{password:"demo",role:"fund_manager",name:"Sarah O'Brien",status:"pending"},
  "admin@demo.com":{password:"demo",role:"admin",name:"Admin — eoghar"}
};

const INVITE_CODES=["EOGHAR-2026-INV","DEMO-FUND-001"];

/* ── JURISDICTIONS ── */
const JURISDICTION_OPTIONS=["Ireland","Luxembourg","Cayman Islands","British Virgin Islands","Malta","United States","United Kingdom","Singapore","Jersey","Guernsey","Netherlands","Germany","France","UAE"];
const REPORTING_REQUIREMENTS={
  "Ireland":["AIFMD Reporting","Central Bank of Ireland Returns","Annual Audited Accounts","FATCA / CRS","Form 12 (Corporation Tax)"],
  "Luxembourg":["CSSF Regulatory Reports","AIFMD Annex IV","Annual Report (RCSL)","FATCA / CRS","VAT Returns"],
  "Cayman Islands":["CIMA Returns","FATCA / CRS","Annual Return (CIMA)","AML Compliance Report"],
  "British Virgin Islands":["FSC Annual Return","FATCA / CRS","AML / CFT Report","Economic Substance Returns"],
  "Malta":["MFSA Quarterly Reports","AIFMD Reporting","Annual Audited Accounts","FATCA / CRS"],
  "United States":["SEC Form ADV","Form PF","FATCA Returns","Annual Audited Accounts","K-1 Distribution"],
  "United Kingdom":["FCA Regulatory Returns","AIFMD Reporting","HMRC FATCA/CRS","Annual Report & Accounts"],
  "Singapore":["MAS Returns","Annual Report","FATCA / CRS","Form C (Tax)"],
  "Jersey":["JFSC Returns","Annual Accounts","FATCA / CRS","Economic Substance"],
  "Guernsey":["GFSC Returns","Annual Accounts","FATCA / CRS","Economic Substance"],
  "Netherlands":["AFM Reporting","AIFMD Annex IV","Annual Accounts","FATCA / CRS"],
  "Germany":["BaFin Reporting","AIFMD Annex IV","Annual Accounts","FATCA / CRS"],
  "France":["AMF Reporting","AIFMD Annex IV","Annual Accounts","FATCA / CRS"],
  "UAE":["ADGM/DFSA Returns","FATCA / CRS","Annual Accounts","AML Report"]
};

function Landing({onRole}){
  return(
    <div className="landing">
      <div className="landing-grain"/>
      <div className="landing-glow"/>
      <div className="landing-eyebrow anim-1">Investor Services Platform</div>
      <h1 className="landing-title anim-2">Secure access to<br/><em>your</em> portal</h1>
      <p className="landing-sub anim-3">Select your role to continue</p>
      <div className="role-grid anim-4">
        {[
          {role:"investor",icon:"👤",title:"Investor",desc:"Funds · Documents · Onboarding"},
          {role:"fund_manager",icon:"📊",title:"Fund Manager",desc:"KYC/AML Docs · Fund Materials · CRM"},
          {role:"admin",icon:"🏛️",title:"Admin Firm",desc:"Super User · Approvals · Oversight"},
        ].map(r=>(
          <div className="role-card" key={r.role} onClick={()=>onRole(r.role)}>
            <div className="role-card-icon">{r.icon}</div>
            <div className="role-card-title">{r.title}</div>
            <div className="role-card-desc">{r.desc}</div>
            <div className="role-card-arrow">→</div>
          </div>
        ))}
      </div>
      <div className="landing-mark anim-5">Confidential · Authorised Access Only</div>
    </div>
  );
}

function Login({role,onLogin,onBack,onSetupAccess}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const hints={
    investor:"investor@demo.com / demo",
    fund_manager:"manager@demo.com / demo  (or manager.pending@demo.com for Pending state)",
    admin:"admin@demo.com / demo"
  };
  const labels={investor:"Investor Portal",fund_manager:"Fund Manager Portal",admin:"Admin Portal"};
  const attempt=()=>{
    const u=USERS[email.trim().toLowerCase()];
    if(u&&u.role===role&&u.password===pass) onLogin({...u,email});
    else setErr("Invalid credentials. Please check and try again.");
  };
  return(
    <div className="login-wrap">
      <div className="login-box anim-1">
        <div className="login-back" onClick={onBack}>← Back</div>
        <div className="login-eyebrow">{labels[role]}</div>
        <div className="login-title">Welcome back</div>
        <div className="form-group">
          <label className="form-label">Email address</label>
          <input className={`form-input${err?" error-input":""}`} type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("")}} placeholder="your@email.com" onKeyDown={e=>e.key==="Enter"&&attempt()}/>
        </div>
        <div className="form-group">
          <label className="form-label">Password</label>
          <input className={`form-input${err?" error-input":""}`} type="password" value={pass} onChange={e=>{setPass(e.target.value);setErr("")}} placeholder="••••••••" onKeyDown={e=>e.key==="Enter"&&attempt()}/>
        </div>
        {err&&<div className="form-error">{err}</div>}
        <div className="form-hint">Demo: {hints[role]}</div>
        <div style={{marginTop:20}}>
          <button className="btn btn-primary btn-full" onClick={attempt}>Sign In →</button>
        </div>
        {role==="fund_manager"&&(
          <div className="setup-link">
            <div className="setup-link-label">New Fund Manager?</div>
            <span className="setup-link-btn" onClick={onSetupAccess}>Set up your access →</span>
          </div>
        )}
      </div>
    </div>
  );
}

function InviteGate({onValidCode,onBack}){
  const [code,setCode]=useState("");
  const [err,setErr]=useState("");
  const validate=()=>{
    if(INVITE_CODES.includes(code.trim().toUpperCase())){onValidCode(code.trim().toUpperCase())}
    else setErr("Invalid or expired invitation code. Please contact your administrator.");
  };
  return(
    <div className="invite-wrap">
      <div className="invite-box anim-1">
        <div className="login-back" onClick={onBack}>← Back</div>
        <div className="invite-icon">✉️</div>
        <div className="invite-title">Enter your invitation code</div>
        <div className="invite-sub">Access to this platform is by invitation only. Your administrator will have sent you a unique invitation code by email. Enter it below to begin setting up your fund manager account.</div>
        <div className="form-group">
          <label className="form-label">Invitation Code</label>
          <input className={`form-input${err?" error-input":""}`} value={code} onChange={e=>{setCode(e.target.value);setErr("")}} placeholder="e.g. EOGHAR-2026-INV" style={{textTransform:"uppercase",letterSpacing:"0.1em"}} onKeyDown={e=>e.key==="Enter"&&validate()}/>
        </div>
        {err&&<div className="form-error">{err}</div>}
        <button className="btn btn-primary btn-full" style={{marginTop:4}} onClick={validate}>Verify Code →</button>
        <div className="invite-note">Demo code: <strong>EOGHAR-2026-INV</strong><br/>No invitation? Contact <strong>admin@eoghar.dev</strong> to request access.</div>
      </div>
    </div>
  );
}

function FundOnboardingForm({inviteCode,onSubmit,onBack}){
  const [step,setStep]=useState(0);
  const [files,setFiles]=useState([]);
  const [aiProcessing,setAiProcessing]=useState(false);
  const [aiDone,setAiDone]=useState(false);
  const [jurisdictions,setJurisdictions]=useState([]);
  const [addingJ,setAddingJ]=useState("");
  const [reportingReqs,setReportingReqs]=useState({});
  const [form,setForm]=useState({
    fundName:"",legalName:"",fundType:"",structure:"",inceptionDate:"",aum:"",currency:"EUR",
    domicile:"",regulatoryStatus:"",primaryContact:"",email:"",phone:"",
    legalContact:"",complianceContact:"",fundAdminContact:"",existingAdmin:""
  });
  const steps=["Documents","Fund Details","Regulatory Profile","Key Contacts","Review"];
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const handleFiles=(e)=>{
    const newFiles=Array.from(e.target.files).map(f=>({name:f.name,size:f.size,status:"uploaded"}));
    setFiles(prev=>[...prev,...newFiles]);
  };
  const runAIPrefill=()=>{
    setAiProcessing(true);
    setTimeout(()=>{
      setForm(f=>({...f,fundName:"Harrington Capital Partners III",legalName:"Harrington Capital Partners III ICAV",fundType:"Alternative Investment Fund",structure:"ICAV",inceptionDate:"2024-01-15",aum:"250,000,000",currency:"EUR",domicile:"Ireland",regulatoryStatus:"Authorised AIFM"}));
      setJurisdictions(["Ireland","Cayman Islands","Luxembourg"]);
      setReportingReqs({"Ireland":["AIFMD Reporting","Central Bank of Ireland Returns","Annual Audited Accounts","FATCA / CRS"],"Cayman Islands":["CIMA Returns","FATCA / CRS","Annual Return (CIMA)"],"Luxembourg":["CSSF Regulatory Reports","AIFMD Annex IV","Annual Report (RCSL)"]});
      setFiles(prev=>prev.map(f=>({...f,status:"processed"})));
      setAiProcessing(false);
      setAiDone(true);
    },2200);
  };
  const addJurisdiction=()=>{
    if(addingJ&&!jurisdictions.includes(addingJ)){
      setJurisdictions(j=>[...j,addingJ]);
      setReportingReqs(r=>({...r,[addingJ]:REPORTING_REQUIREMENTS[addingJ]||[]}));
      setAddingJ("");
    }
  };
  const removeJurisdiction=(j)=>{
    setJurisdictions(prev=>prev.filter(x=>x!==j));
    setReportingReqs(prev=>{const n={...prev};delete n[j];return n;});
  };
  const toggleReq=(j,req)=>{
    setReportingReqs(prev=>({...prev,[j]:prev[j].includes(req)?prev[j].filter(r=>r!==req):[...(prev[j]||[]),req]}));
  };
  return(
    <div className="onboard-wrap">
      <div className="onboard-inner">
        <div className="onboard-header anim-1">
          <div className="onboard-eyebrow">Fund Manager Onboarding · Invite: {inviteCode}</div>
          <div className="onboard-title">Set up your fund</div>
          <div className="onboard-sub">Complete all sections below. Your account will be reviewed by our team before going live — you'll be notified within 2 business days.</div>
        </div>
        <div className="progress-bar">{steps.map((s,i)=><div key={s} className={`progress-step${i===step?" active":i<step?" done":""}`}/>)}</div>
        <div className="progress-labels">{steps.map((s,i)=><div key={s} className={`progress-label${i===step?" active":""}`}>{s}</div>)}</div>

        {step===0&&(
          <div className="anim-1">
            <div className="ai-prefill-banner">
              <div className="ai-prefill-icon">✨</div>
              <div className="ai-prefill-text"><strong>AI-powered form completion</strong><br/>Upload your fund establishment documents (PPM, LPA, constitutional docs, regulatory filings) and our AI will automatically read them and pre-fill the onboarding form for you. You can review and correct any details before submitting.</div>
            </div>
            <div className="form-card">
              <div className="form-card-title">Upload Fund Documents</div>
              <div className="upload-zone">
                <input type="file" multiple accept=".pdf,.doc,.docx" onChange={handleFiles}/>
                <div className="upload-zone-icon">📁</div>
                <div className="upload-zone-title">Drop files here or click to browse</div>
                <div className="upload-zone-sub">Accepted: PDF, DOC, DOCX · PPM, LPA, Constitutional Docs, Regulatory Filings</div>
              </div>
              {files.map((f,i)=>(
                <div key={i} className="uploaded-file">
                  <div className="uploaded-file-icon">📄</div>
                  <div className="uploaded-file-name">{f.name}</div>
                  <div className="uploaded-file-status">{f.status==="processed"?"✅ Processed":aiProcessing?"⏳ Reading...":"✓ Uploaded"}</div>
                </div>
              ))}
              {files.length>0&&!aiDone&&<button className="btn btn-gold" style={{marginTop:16}} onClick={runAIPrefill} disabled={aiProcessing}>{aiProcessing?"✨ Reading documents...":"✨ Auto-fill form with AI"}</button>}
              {aiDone&&<div style={{marginTop:12,padding:"10px 14px",background:"var(--green-bg)",borderRadius:"var(--radius)",fontSize:11,color:"var(--green)"}}>✅ Form pre-filled from your documents. Please review each section.</div>}
            </div>
            <div className="form-nav">
              <button className="btn btn-outline" onClick={onBack}>← Back</button>
              <div style={{display:"flex",alignItems:"center",gap:12}}><span className="step-counter">Step 1 of 5</span><button className="btn btn-primary" onClick={()=>setStep(1)}>Next: Fund Details →</button></div>
            </div>
          </div>
        )}

        {step===1&&(
          <div className="anim-1">
            {aiDone&&<div className="ai-prefill-banner"><div className="ai-prefill-icon">✨</div><div className="ai-prefill-text"><strong>AI pre-filled</strong> — Review and correct any details below.</div></div>}
            <div className="form-card">
              <div className="form-card-title">Fund Identity</div>
              <div className="form-row" style={{marginBottom:16}}>
                <div className="form-group"><label className="form-label">Fund Name</label><input className="form-input" value={form.fundName} onChange={e=>set("fundName",e.target.value)} placeholder="e.g. Apex Capital III"/></div>
                <div className="form-group"><label className="form-label">Legal Entity Name</label><input className="form-input" value={form.legalName} onChange={e=>set("legalName",e.target.value)} placeholder="Full registered name"/></div>
              </div>
              <div className="form-row" style={{marginBottom:16}}>
                <div className="form-group"><label className="form-label">Fund Type</label>
                  <select className="form-select" value={form.fundType} onChange={e=>set("fundType",e.target.value)}>
                    <option value="">Select…</option><option>Alternative Investment Fund</option><option>UCITS</option><option>Venture Capital Fund</option><option>Private Equity Fund</option><option>Real Estate Fund</option><option>Hedge Fund</option>
                  </select>
                </div>
                <div className="form-group"><label className="form-label">Legal Structure</label>
                  <select className="form-select" value={form.structure} onChange={e=>set("structure",e.target.value)}>
                    <option value="">Select…</option><option>ICAV</option><option>SICAV</option><option>LP</option><option>LLC</option><option>Unit Trust</option><option>SPC</option><option>PCC</option>
                  </select>
                </div>
              </div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Inception Date</label><input className="form-input" type="date" value={form.inceptionDate} onChange={e=>set("inceptionDate",e.target.value)}/></div>
                <div className="form-group"><label className="form-label">Domicile</label>
                  <select className="form-select" value={form.domicile} onChange={e=>set("domicile",e.target.value)}>
                    <option value="">Select…</option>{JURISDICTION_OPTIONS.map(j=><option key={j}>{j}</option>)}
                  </select>
                </div>
              </div>
            </div>
            <div className="form-card">
              <div className="form-card-title">Assets Under Management</div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">AUM (approx.)</label><input className="form-input" value={form.aum} onChange={e=>set("aum",e.target.value)} placeholder="e.g. 250,000,000"/></div>
                <div className="form-group"><label className="form-label">Base Currency</label>
                  <select className="form-select" value={form.currency} onChange={e=>set("currency",e.target.value)}>
                    <option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option><option>SGD</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="form-nav">
              <button className="btn btn-outline" onClick={()=>setStep(0)}>← Back</button>
              <div style={{display:"flex",alignItems:"center",gap:12}}><span className="step-counter">Step 2 of 5</span><button className="btn btn-primary" onClick={()=>setStep(2)}>Next: Regulatory Profile →</button></div>
            </div>
          </div>
        )}

        {step===2&&(
          <div className="anim-1">
            <div className="form-card">
              <div className="form-card-title">Regulatory Status</div>
              <div className="form-row" style={{marginBottom:16}}>
                <div className="form-group"><label className="form-label">Regulatory Status</label>
                  <select className="form-select" value={form.regulatoryStatus} onChange={e=>set("regulatoryStatus",e.target.value)}>
                    <option value="">Select…</option><option>Authorised AIFM</option><option>Registered AIFM</option><option>UCITS Management Company</option><option>Self-Managed</option><option>Exempt</option>
                  </select>
                </div>
              </div>
              <div className="form-card-title" style={{marginTop:20}}>Jurisdictions of Registration</div>
              <div style={{marginBottom:12}}>{jurisdictions.map(j=><span key={j} className="jurisdiction-tag">{j}<button onClick={()=>removeJurisdiction(j)}>×</button></span>)}</div>
              <div className="jurisdiction-add">
                <select className="form-select" value={addingJ} onChange={e=>setAddingJ(e.target.value)} style={{flex:1}}>
                  <option value="">Add jurisdiction…</option>{JURISDICTION_OPTIONS.filter(j=>!jurisdictions.includes(j)).map(j=><option key={j}>{j}</option>)}
                </select>
                <button className="btn btn-outline" onClick={addJurisdiction} disabled={!addingJ}>Add</button>
              </div>
            </div>
            {jurisdictions.length>0&&(
              <div className="form-card">
                <div className="form-card-title">Reporting Requirements by Jurisdiction</div>
                <div style={{fontSize:10,color:"var(--ink-muted)",marginBottom:16,lineHeight:1.6}}>Review and confirm the reporting requirements for each jurisdiction. Deselect any that do not apply.</div>
                {jurisdictions.map(j=>(
                  <div key={j} className="jurisdiction-reporting">
                    <div className="jr-header"><div className="jr-flag">📍 {j}</div>{aiDone&&<span className="badge badge-gold" style={{fontSize:8}}>AI extracted</span>}</div>
                    <div className="jr-body">
                      {(REPORTING_REQUIREMENTS[j]||[]).map(req=>(
                        <label key={req} style={{display:"flex",alignItems:"center",gap:10,fontSize:11,color:"var(--ink-mid)",cursor:"pointer",padding:"4px 0"}}>
                          <input type="checkbox" checked={(reportingReqs[j]||[]).includes(req)} onChange={()=>toggleReq(j,req)} style={{accentColor:"var(--gold)"}}/>{req}
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="form-nav">
              <button className="btn btn-outline" onClick={()=>setStep(1)}>← Back</button>
              <div style={{display:"flex",alignItems:"center",gap:12}}><span className="step-counter">Step 3 of 5</span><button className="btn btn-primary" onClick={()=>setStep(3)}>Next: Key Contacts →</button></div>
            </div>
          </div>
        )}

        {step===3&&(
          <div className="anim-1">
            <div className="form-card">
              <div className="form-card-title">Primary Contact</div>
              <div className="form-row" style={{marginBottom:16}}>
                <div className="form-group"><label className="form-label">Full Name</label><input className="form-input" value={form.primaryContact} onChange={e=>set("primaryContact",e.target.value)} placeholder="Name of primary contact"/></div>
                <div className="form-group"><label className="form-label">Email Address</label><input className="form-input" type="email" value={form.email} onChange={e=>set("email",e.target.value)} placeholder="contact@fund.com"/></div>
              </div>
              <div className="form-group"><label className="form-label">Phone Number</label><input className="form-input" value={form.phone} onChange={e=>set("phone",e.target.value)} placeholder="+353 ..."/></div>
            </div>
            <div className="form-card">
              <div className="form-card-title">Additional Contacts</div>
              <div className="form-row" style={{marginBottom:16}}>
                <div className="form-group"><label className="form-label">Legal / Counsel Contact</label><input className="form-input" value={form.legalContact} onChange={e=>set("legalContact",e.target.value)} placeholder="Legal contact name & firm"/></div>
                <div className="form-group"><label className="form-label">Compliance Contact</label><input className="form-input" value={form.complianceContact} onChange={e=>set("complianceContact",e.target.value)} placeholder="Compliance officer name"/></div>
              </div>
              <div className="form-row">
                <div className="form-group"><label className="form-label">Existing Fund Administrator (if any)</label><input className="form-input" value={form.existingAdmin} onChange={e=>set("existingAdmin",e.target.value)} placeholder="Name of current administrator"/></div>
                <div className="form-group"><label className="form-label">Fund Admin Contact</label><input className="form-input" value={form.fundAdminContact} onChange={e=>set("fundAdminContact",e.target.value)} placeholder="Their contact name"/></div>
              </div>
            </div>
            <div className="form-nav">
              <button className="btn btn-outline" onClick={()=>setStep(2)}>← Back</button>

              {crmEvents.map((e,i)=><div key={i} className="crm-trigger-item"><div className="crm-trigger-icon">🔔</div><div className="crm-trigger-label"><strong>{e.investor}</strong> → {e.stage} ({e.crm}) · {e.time}</div><span className={`badge ${e.action.includes("pending")?"badge-gold":"badge-green"}`} style={{fontSize:9,whiteSpace:"nowrap"}}>{e.action}</span></div>)}
            </div>
          </div></>
        )}
        {view==="workflow"&&(
          <><div className="main-header"><div className="page-title">Workflow</div><div className="page-sub">Active tasks and due dates</div></div>
          <div className="main-body">
            {workflow.map((w,i)=><div key={i} className={`workflow-item ${w.type}`}><div className={`workflow-dot dot-${w.type==="overdue"?"red":w.type==="due-soon"?"gold":"green"}`}/><div className="workflow-info"><div className="workflow-title">{w.title}</div><div className="workflow-meta">{w.meta}</div></div></div>)}
          </div></>
        )}
        {view==="documents"&&(
          <><div className="main-header"><div className="page-title">Documents</div><div className="page-sub">All investor and fund materials</div></div>
          <div className="main-body">
            <div className="section-title">Investor KYC/AML Documents</div>
            <div className="table-wrap">
              <div className="table-header" style={{gridTemplateColumns:"2fr 1.5fr 1fr 1fr"}}><span>Document</span><span>Investor</span><span>Received</span><span>Status</span></div>
              {[["Passport — Alexandra Chen","Alexandra Chen","30 Apr","Verified"],["Proof of Address — A. Chen","Alexandra Chen","30 Apr","Verified"],["Certificate of Incorporation — Vanguard","Vanguard Holdings Ltd","—","Outstanding"],["Beneficial Owner Declaration — Vanguard","Vanguard Holdings Ltd","—","Outstanding"]].map(([d,inv,dt,st],i)=>(
                <div key={i} className="table-row" style={{gridTemplateColumns:"2fr 1.5fr 1fr 1fr"}}><span>{d}</span><span style={{color:"var(--ink-muted)"}}>{inv}</span><span>{dt}</span><span><span className={`badge ${st==="Verified"?"badge-green":st==="Outstanding"?"badge-red":"badge-gold"}`}>{st}</span></span></div>
              ))}
            </div>
            <div className="section-title" style={{marginTop:24}}>Admin Documents</div>
            <div className="table-wrap">
              <div className="table-header" style={{gridTemplateColumns:"2fr 1fr 1fr"}}><span>Document</span><span>Issued</span><span>Status</span></div>
              {[["Q1 2026 Fund Report","01 Apr 2026","Published"],["Annual Audited Accounts 2025","15 Mar 2026","Published"],["AIFMD Annex IV Report Q1","28 Mar 2026","Published"]].map(([d,dt,st],i)=>(
                <div key={i} className="table-row" style={{gridTemplateColumns:"2fr 1fr 1fr"}}><span>{d}</span><span style={{color:"var(--ink-muted)"}}>{dt}</span><span><span className="badge badge-green">{st}</span></span></div>
              ))}
            </div>
          </div></>
        )}
      </div>
    </div>
  );
}

function InvestorPortal({user,onLogout}){
  const [view,setView]=useState("dashboard");
  const navItems=[
    {id:"dashboard",icon:"◈",label:"Dashboard"},{id:"funds",icon:"📊",label:"My Funds"},
    {id:"documents",icon:"📁",label:"Documents"},{id:"onboarding",icon:"✍️",label:"My Onboarding"},
  ];
  return(
    <div className="app">
      <div className="sidebar">
        <div className="sidebar-brand"><div className="sidebar-brand-name">eoghar</div><div className="sidebar-brand-sub">Investor Portal</div></div>
        <div className="sidebar-user"><div className="sidebar-user-name">{user.name}</div><div className="sidebar-user-role">Investor</div></div>
        <div className="nav-section"><div className="nav-label">Navigation</div>
          {navItems.map(n=><div key={n.id} className={`nav-item${view===n.id?" active":""}`} onClick={()=>setView(n.id)}><span className="nav-item-icon">{n.icon}</span>{n.label}</div>)}
        </div>
        <div className="sidebar-logout"><span className="logout-btn" onClick={onLogout}>Sign Out</span></div>
      </div>
      <div className="main">
        <div className="main-header"><div className="page-title">{navItems.find(n=>n.id===view)?.label}</div><div className="page-sub">Welcome back, {user.name}</div></div>
        <div className="main-body">
          {view==="dashboard"&&<div className="stat-grid">{[["My Funds","1","Active investment"],["Total Committed","€500,000","EUR"],["Documents","4","In repository"],["Onboarding","Complete","All docs verified"]].map(([l,v,s])=><div key={l} className="stat-card"><div className="stat-label">{l}</div><div className="stat-value">{v}</div><div className="stat-sub">{s}</div></div>)}</div>}
          {view==="funds"&&<div className="table-wrap"><div className="table-header" style={{gridTemplateColumns:"2fr 1fr 1fr 1fr"}}><span>Fund</span><span>Committed</span><span>Since</span><span>Status</span></div><div className="table-row" style={{gridTemplateColumns:"2fr 1fr 1fr 1fr"}}><span style={{fontWeight:500}}>Harrington Capital Partners III</span><span>€500,000</span><span>Jan 2026</span><span><span className="badge badge-green">Active</span></span></div></div>}
          {view==="documents"&&<div className="table-wrap"><div className="table-header" style={{gridTemplateColumns:"2fr 1fr 1fr"}}><span>Document</span><span>From</span><span>Date</span></div>{[["Q1 2026 Fund Report","Harrington Capital III","01 Apr 2026"],["Annual Audited Accounts 2025","Harrington Capital III","15 Mar 2026"],["Welcome Letter","Harrington Capital III","15 Jan 2026"],["KYC Confirmation","eoghar Admin","20 Jan 2026"]].map(([d,f,dt],i)=><div key={i} className="table-row" style={{gridTemplateColumns:"2fr 1fr 1fr"}}><span>{d}</span><span style={{color:"var(--ink-muted)"}}>{f}</span><span>{dt}</span></div>)}</div>}
          {view==="onboarding"&&<div style={{maxWidth:520}}>{[["Full Name","Alexandra Chen","✅"],["Entity Type","Individual","✅"],["Passport","Uploaded & Verified","✅"],["Proof of Address","Uploaded & Verified","✅"],["Source of Funds Declaration","Completed","✅"],["AML Screening","Passed","✅"]].map(([l,v,s],i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"13px 0",borderBottom:"1px solid var(--paper-mid)",fontSize:11,alignItems:"center"}}><span style={{color:"var(--ink-muted)"}}>{l}</span><span style={{color:"var(--ink)"}}>{v}</span><span className="badge badge-green">{s}</span></div>)}</div>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("landing");
  const [selectedRole,setSelectedRole]=useState(null);
  const [user,setUser]=useState(null);
  const [inviteCode,setInviteCode]=useState(null);
  const handleRole=(role)=>{setSelectedRole(role);setScreen("login");}
  const handleLogin=(u)=>{
    setUser(u);
    if(u.role==="fund_manager"&&u.status==="pending") setScreen("pending");
    else if(u.role==="admin") setScreen("admin");
    else if(u.role==="fund_manager") setScreen("fund_manager");
    else setScreen("investor");
  };
  const handleSetupAccess=()=>setScreen("invite_gate");
  const handleValidCode=(code)=>{setInviteCode(code);setScreen("onboarding_form");}
  const handleOnboardingSubmit=()=>setScreen("submitted");
  const handleLogout=()=>{setUser(null);setSelectedRole(null);setInviteCode(null);setScreen("landing");}
  if(screen==="landing") return <Landing onRole={handleRole}/>;
  if(screen==="login") return <Login role={selectedRole} onLogin={handleLogin} onBack={()=>setScreen("landing")} onSetupAccess={handleSetupAccess}/>;
  if(screen==="invite_gate") return <InviteGate onValidCode={handleValidCode} onBack={()=>setScreen("login")}/>;
  if(screen==="onboarding_form") return <FundOnboardingForm inviteCode={inviteCode} onSubmit={handleOnboardingSubmit} onBack={()=>setScreen("login")}/>;
  if(screen==="submitted") return(
    <div className="pending-wrap"><div className="pending-box anim-1" style={{textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:20}}>🎉</div>
      <div className="pending-badge"><div className="pending-dot"/><span>Application Submitted</span></div>
      <div className="pending-title">Application received</div>
      <div className="pending-sub" style={{marginBottom:28}}>Thank you for completing the onboarding form. Your application has been sent to the admin team for review. You will receive a confirmation email shortly and will be notified when your account goes live.</div>
      <button className="btn btn-outline btn-full" onClick={handleLogout}>← Return to Login</button>
    </div></div>
  );
  if(screen==="pending") return <PendingScreen user={user} onLogout={handleLogout}/>;
  if(screen==="admin") return <AdminPortal user={user} onLogout={handleLogout}/>;
  if(screen==="fund_manager") return <FundManagerPortal user={user} onLogout={handleLogout}/>;
  if(screen==="investor") return <InvestorPortal user={user} onLogout={handleLogout}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
